services:
  rails-db:
    image: postgres:15-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: password, POSTGRES_DB: rails_parity }
    ports: ["55431:5432"]
  dotnet-db:
    image: postgres:15-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: password, POSTGRES_DB: dotnet_parity }
    ports: ["55432:5432"]
  rails-app:
    build: { context: ./.rails-source, target: dev }
    command: sh -c "bundle exec rails db:prepare && psql $$DATABASE_URL -f /fixtures/synthetic-fixtures.sql && bundle exec rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      ENVIRONMENT: parity
      DATABASE_URL: postgres://postgres:password@rails-db:5432/rails_parity
      DOMAIN: localhost:3000
      BOT_TOKEN: parity-webhook-secret
      CONTENTFUL_SPACE: synthetic
      CONTENTFUL_DELIVERY_TOKEN: synthetic
      CONTENTFUL_PREVIEW_TOKEN: synthetic
      CONTENTFUL_ENVIRONMENT: master
      CONTENTFUL_API_URL: contentful-fake:4020
      GOVUK_NOTIFY_API_KEY: synthetic
      GOV_ONE_BASE_URI: http://gov-one-login-simulator:3000
      GOV_ONE_CLIENT_ID: HGIOgho9HIRhgoepdIOPFdIUWgewi0jw
      GOV_ONE_PRIVATE_KEY_PATH: /run/secrets/gov-one-private-key.pem
    depends_on: [rails-db, gov-one-login-simulator, notify-fake, contentful-fake]
    volumes: ["./fixtures:/fixtures:ro", "../keys/gov-one-simulator-private-key.pem:/run/secrets/gov-one-private-key.pem:ro"]
    ports: ["3000:3000"]
  rails-schema-for-dotnet:
    build: { context: ./.rails-source, target: dev }
    command: sh -c "bundle exec rails db:prepare && psql $$DATABASE_URL -f /fixtures/synthetic-fixtures.sql"
    environment:
      RAILS_ENV: development
      ENVIRONMENT: parity
      DATABASE_URL: postgres://postgres:password@dotnet-db:5432/dotnet_parity
      CONTENTFUL_SPACE: synthetic
      CONTENTFUL_DELIVERY_TOKEN: synthetic
      CONTENTFUL_PREVIEW_TOKEN: synthetic
      CONTENTFUL_ENVIRONMENT: master
    depends_on: [dotnet-db]
    volumes: ["./fixtures:/fixtures:ro"]
  dotnet-app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    command: sh -c "dotnet run --artifacts-path /tmp/dotnet-artifacts --project src/EarlyYearsFoundationRecovery.Web -- --migrate && dotnet run --artifacts-path /tmp/dotnet-artifacts --project src/EarlyYearsFoundationRecovery.Web --urls http://0.0.0.0:5000"
    volumes: ["..:/workspace"]
    environment:
      ASPNETCORE_ENVIRONMENT: Parity
      ConnectionStrings__DefaultConnection: Host=dotnet-db;Port=5432;Database=dotnet_parity;Username=postgres;Password=password
      Notify__BaseUrl: http://notify-fake:4010
      Notify__ApiKey: local-notify-key
      Notify__CallbackToken: parity-webhook-secret
      Contentful__WebhookSecret: parity-webhook-secret
      GovOne__BaseUri: http://gov-one-login-simulator:3000
      GovOne__ServiceUrl: http://localhost:5000
      GovOne__PrivateKeyPath: /workspace/keys/gov-one-simulator-private-key.pem
      OpenTelemetry__Enabled: "false"
    depends_on:
      rails-schema-for-dotnet: { condition: service_completed_successfully }
    ports: ["5000:5000"]
  notify-fake:
    image: python:3.13-alpine
    command: python /app/protocol_fake.py
    environment: { FAKE_MODE: notify, PORT: "4010", REQUEST_STORE: /data/notify.jsonl }
    volumes: ["./fakes:/app:ro", "fake-data:/data"]
    ports: ["4010:4010"]
  contentful-fake:
    image: python:3.13-alpine
    command: python /app/protocol_fake.py
    environment: { FAKE_MODE: contentful, PORT: "4020", REQUEST_STORE: /data/contentful.jsonl }
    volumes: ["./fakes:/app:ro", "./fixtures:/fixtures:ro", "../data:/fixtures/data:ro", "fake-data:/data"]
    ports: ["4020:4020"]
  gov-one-login-simulator:
    image: ghcr.io/govuk-one-login/simulator:latest
    environment:
      SIMULATOR_URL: http://gov-one-login-simulator:3000
      CLIENT_ID: HGIOgho9HIRhgoepdIOPFdIUWgewi0jw
      REDIRECT_URLS: http://localhost:3000/users/auth/openid_connect/callback,http://localhost:5000/users/auth/openid_connect/callback
      POST_LOGOUT_REDIRECT_URLS: http://localhost:3000/users/sign_out,http://localhost:5000/users/sign_out
    ports: ["3333:3000"]
volumes:
  fake-data:
